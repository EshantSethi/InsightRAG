spring:
  application:
    name: insightrag
  # In-memory H2 backs the agent's SQL tool with precise structured data (release versions/dates).
  # DB_CLOSE_DELAY=-1 keeps the in-memory DB alive for the JVM's lifetime, not just the first connection.
  datasource:
    url: jdbc:h2:mem:insightrag;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always        # always run schema.sql + data.sql on startup (seeds the SQL tool's table)

# RAG pipeline tuning. Every value is overridable via environment variables (relaxed binding),
# e.g. INSIGHTRAG_RETRIEVAL_TOPK=6, INSIGHTRAG_LLM_PROVIDER=anthropic, ANTHROPIC_API_KEY=...
insightrag:
  ingestion:
    data-dir: data
    chunk-size-tokens: 500
    chunk-overlap-tokens: 80
  retrieval:
    top-k: 4
    min-score: 0.5
    candidate-multiplier: 4
  llm:
    provider: auto         # auto = Claude when ANTHROPIC_API_KEY is set, else the free mock
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-haiku-4-5
    temperature: 0.0
    max-tokens: 1024

logging:
  level:
    com.eshant.insightrag: INFO

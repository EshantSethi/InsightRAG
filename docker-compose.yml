# Runs InsightRAG against a real pgvector-backed Postgres — the "production path" vector store,
# versus the zero-dependency in-memory store used by default.
#
#   docker compose up --build
#
# The app stays 100% free by default (mock LLM). To use real Claude, export ANTHROPIC_API_KEY first.
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Activate the pgvector profile so AppConfig wires PgVectorEmbeddingStore instead of in-memory.
      SPRING_PROFILES_ACTIVE: pgvector
      PGVECTOR_HOST: pgvector
      PGVECTOR_PORT: 5432
      PGVECTOR_DB: insightrag
      PGVECTOR_USER: insightrag
      PGVECTOR_PASSWORD: insightrag
      # Empty by default -> the free deterministic mock LLM. Set in your shell to use Claude.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      pgvector:
        condition: service_healthy

  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: insightrag
      POSTGRES_USER: insightrag
      POSTGRES_PASSWORD: insightrag
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightrag -d insightrag"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
